<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position of css propertity</title>
  </head>
  <style>
    .section {
      border: 1px solid;
      width: 100px;
      height: 100px;
    }
    .parents {
      width: 400px;
      height: 400px;
      border: 2px solid;
      position: relative;
      top: 20px;
      background-color: aqua;
    }
    .section_1 {
      background-color: aqua;
      position: absolute;
      top: 2px;
    }
    .section_2 {
      background-color: bisque;
      position: absolute;
      bottom: 5px;
    }
    .section_3 {
      background-color: black;
      position: relative;
      top: 50px;
    }
    ul {
      background-color: aquamarine;
      position: sticky;
      top: 0px;
      z-index: 2;
    }
    ul > li {
      display: inline-block;
      border: 1px solid;
      padding: 5px;
      border-radius: 5px;
    }
  </style>
  <body>
    <div class="section"></div>
    <ul>
      <li>link1</li>
      <li>link2</li>
      <li>link3</li>
      <li>link4</li>
    </ul>

    <div class="parents"><div class="section_1 section"></div></div>
    <div class="section_2 section"></div>
    <div class="section_3 section"></div>
  </body>
</html>
