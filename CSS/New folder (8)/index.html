<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .count {
        border: 1px solid;
        width: 80vw;
        height: 80vh;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        /* gap: 20px;
        column-gap: 30px; */
        gap: 10px 30px;
      }
      .grid {
        /* /* width: 100px;
        height: 100px; */
        border: 1px solid;
      }
      .grid2 {
        grid-row-start: 1;
        grid-row-end: 4;
        grid-column: 1/3;
      }
    </style>
  </head>
  <body>
    <div class="count">
      <div class="grid grid0"></div>
      <div class="grid grid1"></div>
      <div class="grid grid2"></div>
      <div class="grid grid3"></div>
      <div class="grid grid4"></div>
      <div class="grid grid5"></div>
    </div>
  </body>
</html>
