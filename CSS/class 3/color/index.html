<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color</title>
    <style>
        /* foreground and background */
        /* foreground color */
        /* naming color */
        div{
            color: aliceblue;
        }
        /* hex code color */
        h1{
            color: #1f0c8b ;
        }
        /* rgb color */
        /* range 0 to 255 */
        h2{
            color: rgb(149, 187, 14);
        }
        /* background color */
        /* naming color */
        div{
            
            background-color: black;
        }
        /* rgba color */
        h3{
        background-color: rgba(50,60, 30, 0.5);
        }
        /* 0pacity */
        h4{
            opacity: 0.1;
        }


    </style>
</head>
<body>
   <div>
    Lorem ipsum dolor sit amet.
   </div>
   <h1>zahid safi</h1>
   <h2>muneeb</h2>
   <h3>shakir</h3>
   <h4>shabir</h4>
</body>
</html>
