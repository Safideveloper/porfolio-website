<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .anima {
        width: 100px;
        height: 100px;
        border: 1px solid;
        /* animation-name: identifier; */
        animation-name: changecolor;
        animation-duration: 2s;
        /* animation-timing-function: linear; */
        /* animation-fill-mode: forwards; */
        /* animation-iteration-count: alternate; */
        /* animation-delay: 4s; */
      }
      /* @keyframes identifier {
        form {
          transform: translateX(0px);
        }
        to {
          transform: translateX(500px);
          border-radius: 50%;
        }
      } */
      @keyframes changecolor {
        0% {
          transform: translateX(0px);
        }

        10% {
          background-color: blue;
        }
        50% {
          border-radius: 50%;
        }
        100% {
          transform: translateX(500px);
        }
      }
      .loading {
        width: 40px;
        height: 40px;
        border-top: 1px solid blue;
        background: #ccc;
        margin: auto;
        border-radius: 50%;
        animation-name: loading;
        animation-duration: 2s;
        animation-iteration-count: infinite;
        /* animation-direction: reverse; */
        /* animation-direction: alternate-reverse; */
        /* animation-direction: alternate; */
        /* animation-fill-mode: both; */
        animation-timing-function: linear;
        box-shadow: 2px 2px 5px blue;
        background-image: url(../../../CSS/zahid\ safo.png);
      }
      @keyframes loading {
        form {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .progree {
        border: 1px solid;
        width: 100px;
        height: 100px;
        animation-name: progree;
        animation-duration: 2s;
        border-radius: 50%;
        animation-direction: alternate-reverse;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes progree {
        100% {
          transform: translateY(300px);
        }
        0% {
          transform: translateY(opx);
        }
      }
      .cir {
        width: 100px;
        height: 100px;
        border: 1px solid;
        animation-name: cir;
        animation-duration: 4s;
        position: relative;
        animation-iteration-count: infinite;
      }
      @keyframes cir {
        0% {
          top: 0px;
          left: 0%;
        }
        25% {
          top: 0;
          left: 500px;
        }
        50% {
          left: 500px;
          top: 500px;
        }
        75% {
          right: 0px;
          top: 500px;
        }
        100% {
          top: 0px;
          left: 0px;
        }
      }
      .section {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: start;
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <!-- <div class="anima"></div> -->
    <!-- <div class="loading"></div> -->
    <!-- <div class="progree"></div> -->
    <section class="section"><div class="cir"></div></section>
  </body>
</html>
